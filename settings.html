<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FarmGuard — Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="toast-a" id="toastArea"></div>

<div class="app">
    <!-- Header -->
    <div class="header">
        <div class="brand">
            <div class="brand-logo"><i class="bi bi-shield-check"></i></div>
            <div class="brand-name" id="headerBrandName">Farm<span>Guard</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
            <button id="darkModeBtn" class="dark-mode-btn" onclick="toggleDarkMode()" title="Toggle Dark Mode">
                <i class="bi bi-moon-fill"></i>
            </button>
        </div>
    </div>

    <!-- Settings Top -->
    <div class="section-top">
        <div>
            <div style="font-weight:600;font-size:18px">Settings</div>
            <div style="color:var(--muted);font-size:13px">Manage account, preferences, and app data</div>
        </div>
    </div>

    <div style="padding:16px;">
        <!-- Profile -->
        <div class="g-card">
            <div class="card-hd" style="align-items:center;gap:12px;">
                <div style="width:56px;height:56px;border-radius:8px;overflow:hidden;background:#f1f1f1;display:flex;align-items:center;justify-content:center" id="logoPreview">
                    <i class="bi bi-person-fill" style="font-size:24px;color:var(--muted)"></i>
                </div>
                <div style="flex:1">
                    <div style="font-weight:600" id="profileNameLabel">Your Name</div>
                    <div style="color:var(--muted);font-size:13px">Account display name and logo</div>
                </div>
            </div>
            <div class="mo-bd">
                <div class="mb-3">
                    <label class="form-label">Display name</label>
                    <input id="displayName" class="form-control" placeholder="Enter display name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Upload logo</label>
                    <input id="logoFile" type="file" accept="image/*" class="form-control" onchange="previewLogo(event)">
                </div>
                <div style="display:flex;gap:8px">
                    <button class="btn btn-primary" onclick="saveAccountSettings()">Save</button>
                    <button class="btn btn-outline-secondary" onclick="resetAppData()">Reset App Data</button>
                </div>
            </div>
        </div>

        <!-- Preferences -->
        <div class="g-card mt-3">
            <div class="mo-bd">
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
                    <div>
                        <div style="font-weight:600">Notifications</div>
                        <div style="color:var(--muted);font-size:13px">Receive push alerts for important events</div>
                    </div>
                    <label class="tog">
                        <input type="checkbox" id="notifToggle">
                        <span class="tog-s"></span>
                    </label>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
                    <div>
                        <div style="font-weight:600">Units</div>
                        <div style="color:var(--muted);font-size:13px">Temperature units and measurements</div>
                    </div>
                    <div>
                        <select id="unitSelect" class="form-select" style="width:120px">
                            <option value="metric">Metric (°C)</option>
                            <option value="imperial">Imperial (°F)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- About / Version -->
        <div class="g-card mt-3">
            <div class="mo-bd">
                <div style="font-weight:600">About</div>
                <div style="color:var(--muted);font-size:13px;margin-top:8px">FarmGuard Assist — lightweight device management for small farms.</div>
                <div style="color:var(--muted);font-size:13px;margin-top:8px">Version: 1.0.0</div>
            </div>
        </div>
    </div>

</div>

<!-- Bottom Nav -->
<div class="bnav">
    <button class="ni" onclick="navHome()"><i class="bi bi-house-fill"></i><span>Home</span></button>
    <button class="ni" onclick="navDevice()"><i class="bi bi-cpu"></i><span>Device</span></button>
    <button class="ni" onclick="alert('Analytics page coming soon')"><i class="bi bi-bar-chart-fill"></i><span>Analytics</span></button>
    <button class="ni act" onclick="navSettings()"><i class="bi bi-gear"></i><span>Settings</span></button>
    <button class="ni" onclick="navAccount()"><i class="bi bi-person-fill"></i><span>Account</span></button>
</div>

<script>
function previewLogo(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
        const el = document.getElementById('logoPreview');
        el.innerHTML = '<img src="'+ev.target.result+'" style="width:100%;height:100%;object-fit:cover">';
    }
    reader.readAsDataURL(file);
}
function resetAppData(){
    if(!confirm('Reset app data? This will clear saved farms and settings.')) return;
    localStorage.clear();
    location.reload();
}
function saveAccountSettings(){
    const name = document.getElementById('displayName').value || '';
    if(name) localStorage.setItem('displayName', name);
    const unit = document.getElementById('unitSelect').value;
    localStorage.setItem('units', unit);
    localStorage.setItem('notifications', document.getElementById('notifToggle').checked ? '1' : '0');
    showToast('Settings saved');
    setTimeout(()=>location.reload(),600);
}
function showToast(msg){
    const t = document.getElementById('toastArea');
    t.innerHTML = '<div class="toast show" style="position:fixed;left:16px;bottom:80px;">'+msg+'</div>';
    setTimeout(()=>t.innerHTML='',2000);
}
window.addEventListener('DOMContentLoaded',()=>{
    const name = localStorage.getItem('displayName');
    if(name){ document.getElementById('displayName').value = name; document.getElementById('profileNameLabel').textContent = name; }
    const unit = localStorage.getItem('units'); if(unit) document.getElementById('unitSelect').value = unit;
    const notif = localStorage.getItem('notifications'); if(notif==='1') document.getElementById('notifToggle').checked = true;
});
</script>

<script src="js/script.js"></script>
</body>
</html>
