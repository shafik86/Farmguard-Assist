<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - FarmGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <div class="brand-logo" id="headerLogo">
                    <i class="bi bi-shield-check"></i>
                </div>
                <div class="brand-name" id="headerBrandName">Farm<span>Guard</span></div>
            </div>
            <div class="hdr-right">
                <button class="hdr-btn" onclick="toggleDarkMode()">
                    <i class="bi bi-moon-fill dm-btn" id="darkModeIcon"></i>
                </button>
            </div>
        </div>

        <!-- Profile Section -->
        <div class="profile-section">
            <div class="logo-container">
                <img id="profileLogo" src="images/logo/logo.png" alt="FarmGuard Logo" class="profile-logo">
                <button class="logo-edit-btn" onclick="triggerLogoUpload()">
                    <i class="bi bi-pencil-fill"></i>
                </button>
                <input type="file" id="logoUpload" accept="image/*" style="display:none" onchange="handleLogoUpload(event)">
            </div>
            <div class="display-name-container">
                <div class="dn-label">Display Name</div>
                <div class="dn-current" id="displayNameText">FarmGuard</div>
                <button class="dn-edit-btn" onclick="editDisplayName()">
                    <i class="bi bi-pencil"></i> Edit
                </button>
            </div>
        </div>

        <!-- Edit Display Name Modal -->
        <div id="editNameModal" class="modal" style="display:none">
            <div class="modal-content">
                <div class="modal-hdr">
                    <span>Edit Display Name</span>
                    <button class="modal-close" onclick="closeEditNameModal()">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="text" id="nameInput" class="name-input" placeholder="Enter new name" value="FarmGuard">
                </div>
                <div class="modal-footer">
                    <button class="btn-cancel" onclick="closeEditNameModal()">Cancel</button>
                    <button class="btn-save" onclick="saveDisplayName()">Save</button>
                </div>
            </div>
        </div>

        <!-- Menu Sections -->
        <div class="menu-section">
                <button class="menu-item" onclick="window.location.href='ladang-list.html'">
                <div class="mi-left">
                    <div class="mi-icon"><i class="bi bi-plus-circle"></i></div>
                    <div class="mi-text">Add Ladang</div>
                </div>
                <i class="bi bi-chevron-right mi-arrow"></i>
            </button>
        </div>

        <div class="menu-section">
            <button class="menu-item" onclick="toggleNotifications()">
                <div class="mi-left">
                    <div class="mi-icon"><i class="bi bi-bell"></i></div>
                    <div class="mi-text">Notifications</div>
                </div>
                <i class="bi bi-chevron-right mi-arrow" id="notifArrow"></i>
            </button>
            <div id="notificationsPanel" class="collapse-panel" style="display:none">
                <div class="panel-content">
                    <label class="notif-item">
                        <input type="checkbox" checked> Motion Detection Alerts
                    </label>
                    <label class="notif-item">
                        <input type="checkbox" checked> Device Status Changes
                    </label>
                    <label class="notif-item">
                        <input type="checkbox" checked> Low Battery Warnings
                    </label>
                    <label class="notif-item">
                        <input type="checkbox"> System Updates
                    </label>
                </div>
            </div>
        </div>

        <div class="menu-section">
            <button class="menu-item" onclick="toggleAbout()">
                <div class="mi-left">
                    <div class="mi-icon"><i class="bi bi-info-circle"></i></div>
                    <div class="mi-text">About App</div>
                </div>
                <i class="bi bi-chevron-right mi-arrow" id="aboutArrow"></i>
            </button>
            <div id="aboutPanel" class="collapse-panel" style="display:none">
                <div class="panel-content">
                    <div class="about-item">
                        <div class="ai-label">App Name</div>
                        <div class="ai-value">FarmGuard</div>
                    </div>
                    <div class="about-item">
                        <div class="ai-label">Version</div>
                        <div class="ai-value">1.0.0</div>
                    </div>
                    <div class="about-item">
                        <div class="ai-label">Description</div>
                        <div class="ai-value">Farm Security Monitoring System - Real-time device control and monitoring for farm protection</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="menu-section">
            <button class="menu-item" onclick="toggleContacts()">
                <div class="mi-left">
                    <div class="mi-icon"><i class="bi bi-telephone"></i></div>
                    <div class="mi-text">Contacts</div>
                </div>
                <i class="bi bi-chevron-right mi-arrow" id="contactsArrow"></i>
            </button>
            <div id="contactsPanel" class="collapse-panel" style="display:none">
                <div class="panel-content">
                    <div class="contact-card">
                        <div class="contact-name">Nik Shafik</div>
                        <div class="contact-phone">
                            <i class="bi bi-telephone-fill"></i>
                            <a href="tel:+60174511455">+60 1 7451 1455</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bottom Nav -->
<div class="bnav">
    <button class="ni" onclick="navHome()"><i class="bi bi-house-fill"></i><span>Home</span></button>
    <button class="ni" onclick="navDevice()"><i class="bi bi-cpu"></i><span>Device</span></button>
    <button class="ni" onclick="alert('Analytics page coming soon')"><i class="bi bi-bar-chart-fill"></i><span>Analytics</span></button>
    <button class="ni" onclick="navSettings()"><i class="bi bi-gear"></i><span>Settings</span></button>
    <button class="ni act" onclick="navAccount()"><i class="bi bi-person-fill"></i><span>Account</span></button>

        <script src="js/script.js"></script>
</body>
</html>
